name: Restore BANGER.SU root Pages release

on:
  push:
    branches:
      - work/pages-root-recovery-20261030

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/refresh-weather.test.mjs
      - run: npm run check:static
      - run: node scripts/check-visual-release.mjs
      - name: Upload root-domain Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy root-domain Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
