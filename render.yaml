services:
  - type: web
    name: banger-leads
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: MAX_USER_ID
        value: "2758798"
      - key: MAX_BOT_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://banger.su,https://morzzes.github.io
      - key: TRUST_PROXY
        value: "0"
